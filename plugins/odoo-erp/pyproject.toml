[project]
name = "odoo-mcp-server"
version = "0.1.0"
description = "MCP server for Odoo ERP - Sales, Contacts, Invoicing, Projects"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
odoo-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
